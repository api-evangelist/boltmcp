note: >-
  BoltMCP publishes seven packages under the first-party npm scope @boltmcp (publisher dan-kwiat -
  Dan Kwiatkowski, who also authors the BoltMCP blog). NONE of them is a client library for a BoltMCP
  API, so no `SDKs` pointer is emitted - three are a re-published build of the upstream Model Context
  Protocol TypeScript SDK from BoltMCP's fork (github.com/boltmcp/mcp-sdk-ts, branch `custom`), and
  four are a jq filter engine plus its platform binaries. The product itself is distributed as an
  authenticated OCI Helm chart, not through a public registry. PyPI, crates.io, RubyGems, NuGet,
  Maven Central and pkg.go.dev return nothing first-party for boltmcp.
