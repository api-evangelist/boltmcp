note: >-
  BoltMCP publishes no dated changelog or release-notes feed. What it does publish is a version-keyed
  Migration Guide listing the breaking changes to apply before upgrading, organised by minor series.
  That is a real, published, structured record of what changed between versions, so it is captured
  here as the changelog surface - with `dated: false` recorded honestly, because no entry carries a
  date and no public release announcement exists. Releases reach design partners directly.
