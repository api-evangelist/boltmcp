apis:
- aid: boltmcp:boltmcp-mcp-server
  name: BoltMCP MCP Server
  description: The MCP server the BoltMCP Helm chart deploys into the customer's own Kubernetes cluster.
    Customers define their own servers and tools through the BoltMCP dashboard, so the tool surface is
    tenant-defined rather than a fixed public catalog. The chart derives the public hostname from global.domain
    and the ingress documentation names server.<domain> as the externally routed host; agents and MCP
    clients connect there over HTTP, authenticating against the deployment's OIDC provider.
  humanURL: https://install.boltmcp.io/docs/architecture
  image: https://www.boltmcp.io/boltmcp-logo/icon/icon-mark-light-original.png
  baseURL: https://server.{global.domain}/
  tags:
  - MCP
  - Agents
  - Self-Hosted
  tags_raw:
  - Model Context Protocol
  - Agents
  - Self-Hosted
  properties:
  - type: MCPServer
    url: mcp/boltmcp-mcp.yml
  - type: Documentation
    url: https://install.boltmcp.io/docs/ingress-tls
- aid: boltmcp:boltmcp-rest-api
  name: BoltMCP REST API
  description: The internal REST API service (boltmcp-rest-api, container port 3003) that backs the BoltMCP
    dashboard and the deployed MCP servers. It is deliberately NOT given a public ingress hostname by
    the chart - the documented hostname table covers only web, auth, server and inspector - so it is reachable
    only inside the cluster. Documented surface includes the /api/v1/secrets/* endpoints backed by the
    bundled Vault, and a platform-wide 10 MB request-body limit enforced on every request. No OpenAPI
    description is published publicly.
  humanURL: https://install.boltmcp.io/docs/architecture
  image: https://www.boltmcp.io/boltmcp-logo/icon/icon-mark-light-original.png
  baseURL: http://boltmcp-rest-api:3003/api/v1
  x-base-url-note: Cluster-internal Kubernetes Service address, taken verbatim from the published architecture
    and configuration reference. BoltMCP publishes no public base URL for this service because the chart
    does not expose it through ingress.
  tags:
  - REST
  - Self-Hosted
  properties:
  - type: Documentation
    url: https://install.boltmcp.io/docs/configuration-reference
