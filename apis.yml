aid: boltmcp
name: BoltMCP
description: 'BoltMCP is a UK company (BoltMCP Limited) selling a self-hosted platform for creating and
  managing secured Model Context Protocol (MCP) servers inside an organization''s own infrastructure.
  A single Helm chart deploys the full stack into one Kubernetes namespace - a web dashboard, an internal
  REST API, a "gold image" MCP server, the MCP Inspector playground, and optional bundled PostgreSQL,
  Keycloak and HashiCorp Vault. The product''s pitch is token-efficient MCP: progressive disclosure and
  lazy tool registration instead of preloading every tool into an agent''s context, with tools composed
  declaratively from existing REST/gRPC APIs, company docs and API hubs. Auth, RBAC, secrets and observability
  are delegated to infrastructure the customer already runs. Nothing is operated by BoltMCP as a cloud
  service - there is no vendor-hosted API, no public sign-up and no published pricing; access is by design-partner
  arrangement to a preview release.'
