standards:
- id: model-context-protocol
  conforms: true
  domain_standard: true
  evidence: >-
    The entire product is an MCP server platform. The chart deploys a "gold image" MCP server
    (boltmcp-mcp-server) and the upstream MCP Inspector 2.2.0, and BoltMCP publishes its own build of
    the official Model Context Protocol TypeScript SDK to npm under the @boltmcp scope
    (@boltmcp/mcp-sdk-server, -node, -express, forked from modelcontextprotocol/typescript-sdk).
  source: https://install.boltmcp.io/docs/architecture
- id: oauth2
  conforms: true
  evidence: >-
    OIDC clients with client secrets for web, mcp-server and rest-api surfaces; a platform-owned
    client scope boltmcp:rest-api:access reconciled into the realm on every install and upgrade.
  source: https://install.boltmcp.io/docs/configuration-reference
- id: oidc
  conforms: true
  evidence: >-
    OpenID Connect is the only authentication model. The issuer is <keycloak-base>/realms/boltmcp,
    discovery documents are fetched server-side from the public issuer URL, and the supported
    providers named are Keycloak (bundled), Okta, Microsoft Entra and Ping Identity.
  source: https://install.boltmcp.io/docs/sign-in
